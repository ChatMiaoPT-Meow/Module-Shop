plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.24'
}

version = "${mod_version}-forge-${minecraft_version}"
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    // 本地固定的 AtomLib jar（libs/atomlib-1.20.1-forge-0.1.0-beta.jar）。
    flatDir { dirs 'libs' }
}

// ---------------------------------------------------------------- AtomLib（客户端 UI）
// 固定 AtomLib v0.1.0-beta-beta3 的 1.20.1-forge 发布包：
// https://github.com/NoWordz/AtomLib/releases/download/v0.1.0-beta-beta3/atomlib-1.20.1-forge-0.1.0-beta.jar
// 公开 API 与 1.21.1-neoforge 版逐类一致，所以 1.21.1 分支上的界面代码可以原样共用。
def atomlibJar = layout.projectDirectory.file("libs/atomlib-1.20.1-forge-0.1.0-beta.jar")
def atomlibSha256 = "854b0e59887fb8da3aa503034e43b711416d59bc6b984b1e9a6562e8c8615926"
def skijaJar = layout.buildDirectory.file("atomlib-compile/skija-shared-0.143.18.jar")

def verifyAtomLibPin = tasks.register("verifyAtomLibPin") {
    inputs.file(atomlibJar)
    inputs.property("sha256", atomlibSha256)
    def stamp = layout.buildDirectory.file("atomlib-compile/atomlib.sha256")
    outputs.file(stamp)
    doLast {
        def source = inputs.files.singleFile
        def digest = java.security.MessageDigest.getInstance("SHA-256")
        source.withInputStream { stream ->
            byte[] buffer = new byte[8192]
            int read
            while ((read = stream.read(buffer)) > 0) {
                digest.update(buffer, 0, read)
            }
        }
        def actual = digest.digest().collect { String.format("%02x", it & 0xff) }.join("")
        if (actual != atomlibSha256) {
            throw new GradleException("AtomLib pin mismatch: expected ${atomlibSha256} but was ${actual}")
        }
        def out = stamp.get().asFile
        out.parentFile.mkdirs()
        out.text = actual + "\n"
    }
}

def extractAtomSkija = tasks.register("extractAtomSkija") {
    dependsOn verifyAtomLibPin
    inputs.file(atomlibJar)
    outputs.file(skijaJar)
    doLast {
        def source = inputs.files.singleFile
        def dest = outputs.files.singleFile
        dest.parentFile.mkdirs()
        new java.util.zip.ZipFile(source).withCloseable { zip ->
            def entry = zip.getEntry("META-INF/jarjar/skija-shared-0.143.18.jar")
            if (entry == null) {
                throw new GradleException("Pinned AtomLib jar is missing META-INF/jarjar/skija-shared-0.143.18.jar")
            }
            zip.getInputStream(entry).withCloseable { input ->
                dest.withOutputStream { output -> output << input }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // AtomLib 0.1.0-beta（1.20.1-forge）。发布包里的 Minecraft 引用是 SRG 名，开发环境要用 fg.deobf 映射回来。
    // 只进编译和开发运行时，不打进 module_shop；Skija / Yoga 留在 AtomLib 自己的 Jar-in-Jar 里，
    // 这里只把 Skija 类暴露给 javac。
    implementation fg.deobf("local:atomlib-1.20.1-forge:0.1.0-beta")
    compileOnly files(skijaJar)
}

// ---------------------------------------------------------------- KubeJS 桥接（可选）
// 传 -PkubejsJar=<kubejs-forge 的 jar 路径> 才会编译桥接源码；不传时完全不参与构建，
// 主模组不依赖 KubeJS。1.20.1 用 kubejs-forge（2001.x）。
def kubejsJarPath = project.findProperty('kubejsJar')
if (kubejsJarPath) {
    sourceSets {
        kubejsBridge {
            java.srcDirs = ['src/kubejs-bridge/java']
            resources.srcDirs = ['src/kubejs-bridge/resources']
            compileClasspath += sourceSets.main.output + configurations.compileClasspath
            runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
        }
    }
    dependencies {
        kubejsBridgeImplementation files(kubejsJarPath)
    }
    tasks.named('jar', Jar).configure {
        from sourceSets.kubejsBridge.output
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: '[1.20.1,1.21)',
            forge_version: forge_version, forge_version_range: '[47,)',
            loader_version_range: '[47,)',
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.named("compileJava").configure {
    dependsOn verifyAtomLibPin, extractAtomSkija
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // 用 JDK 21 编译，但产物按 1.20.1 的 Java 17 目标输出
    options.release = 17
}