modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="模块商店"
logoFile="shop.png"
authors="${mod_authors}"
description='''
${mod_description}
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# AtomLib：客户端 UI 前置（Skija 渲染桥 + 设计包），与 AtomChat 共用同一个 0.1.0-beta（beta3）。
# 专用服务器不需要安装。
[[dependencies.${mod_id}]]
    modId="atomlib"
    mandatory=true
    versionRange="[0.1.0-beta,)"
    ordering="AFTER"
    side="CLIENT"
